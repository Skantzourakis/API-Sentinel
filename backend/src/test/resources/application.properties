spring.datasource.url=jdbc:h2:mem:api_sentinel_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate

app.jwt.secret=test-secret-for-unit-tests-0123456789abcdef
app.jwt.expiration-seconds=3600

# Every test request comes from the same address, so the per-address limits are raised here.
# RateLimitIntegrationTest checks the real behaviour with low limits.
app.rate-limit.logins-per-address-per-minute=1000
app.rate-limit.logins-per-email-per-15-minutes=5
app.rate-limit.registrations-per-address-per-hour=1000
app.rate-limit.uploads-per-user-per-minute=10
