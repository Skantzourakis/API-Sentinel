spring.application.name=api-sentinel

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api_sentinel}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate

# The local database already had tables before Flyway, so V1 is marked as applied there.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=never
server.error.include-binding-errors=never

# No default key: without JWT_SECRET a random key is generated at startup (see SecurityConfig).
# Set JWT_SECRET (at least 32 random bytes) in any real environment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=3600

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Requests allowed in each time window before the API answers 429 (see RateLimits).
app.rate-limit.logins-per-address-per-minute=20
app.rate-limit.logins-per-email-per-15-minutes=5
app.rate-limit.registrations-per-address-per-hour=10
app.rate-limit.uploads-per-user-per-minute=10
