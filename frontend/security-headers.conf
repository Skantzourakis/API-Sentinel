# Included in every location that serves the app. nginx does not inherit add_header into a
# location that sets its own headers, so the shared ones live in this file.

# The page may only load scripts, styles, fonts and images from this server and only call this
# server's API. If an XSS bug ever let someone inject a script tag, the browser would refuse to run it.
# style-src allows inline styles because sonner (the toasts) adds its CSS in a <style> element at runtime;
# scripts stay strictly limited to files from this server.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# No other site may show this app inside a frame (clickjacking).
add_header X-Frame-Options "DENY" always;
# Files are used only as the type the server declares.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
