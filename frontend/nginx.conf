# Serves the built React app and forwards API and Swagger requests to the Spring backend,
# so the browser talks to a single origin and no CORS setup is needed.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Do not reveal the nginx version in headers and error pages.
    server_tokens off;

    # Uploads are at most 2 MB; bigger request bodies (including JSON) are refused here.
    client_max_body_size 3m;

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # Routes such as /projects/5 exist only in the browser, so they all get index.html.
        try_files $uri /index.html;
    }

    # Built file names contain a hash of their content, so they can be cached for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(api|swagger-ui|v3/api-docs) {
        proxy_pass http://app:8080;
        # Keeps the port, so Swagger UI sends "Try it out" requests back through this server.
        proxy_set_header Host $http_host;
        # Overwritten, never appended to: the backend rate limits per client address, and an
        # appended header would let a client put any address it likes in front of the real one.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
