name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code, so a compromised step cannot push to or change the repository.
permissions:
  contents: read

# Actions are pinned to a commit SHA: a tag such as v7 can later be moved to different code, a SHA cannot.
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and run tests
        run: mvn -B verify

      - name: Build Docker image
        run: docker build -t api-sentinel-backend .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the exact versions from the lockfile
        run: npm ci --ignore-scripts

      # Only the packages that reach the browser; build tools such as the shadcn CLI are left out.
      - name: Check shipped dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Build Docker image
        run: docker build -t api-sentinel-frontend .
