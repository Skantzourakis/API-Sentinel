openapi: 3.0.0
info:
  title: Sample Banking API
  version: 1.0.0
servers:
  - url: http://api.sample-bank.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /accounts:
    get:
      summary: List accounts
      parameters:
        - name: apiKey
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
  /accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get account by id
      responses:
        "200":
          description: OK
        "404":
          description: Account not found
    delete:
      summary: Close account
      responses:
        "204":
          description: Closed
  /admin/users:
    get:
      summary: List admin users
      responses:
        "200":
          description: OK
  /payments:
    post:
      summary: Create payment
      responses:
        "201":
          description: Created
  /transactions:
    get:
      summary: List transactions of the current user
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "401":
          description: Missing or invalid token
