services:
  postgres:
    image: postgres:16
    container_name: api-sentinel-postgres
    environment:
      POSTGRES_DB: api_sentinel
      POSTGRES_USER: postgres
      # Read when the database volume is first created; set DB_PASSWORD before the first start to change it.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # 127.0.0.1: reachable from this computer only, not from the rest of the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Only started with "docker compose --profile app up", so local development
  # with "docker compose up -d" still starts just the database.
  app:
    build: ./backend
    container_name: api-sentinel-app
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/api_sentinel
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Empty means a random key per start (see SecurityConfig).
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
